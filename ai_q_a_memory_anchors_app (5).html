<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Source-of-Truth AI Q&A Learning Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PDF.js for PDF parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Mammoth.js for DOCX parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .highlight-keyword {
      background-color: #fef08a;
      border-bottom: 2px solid #eab308;
      padding: 2px 4px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .highlight-keyword:hover {
      background-color: #fde047;
    }
    ::selection {
      background-color: #bae6fd;
      color: #0369a1;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const AIService = {
      extractKeywords: async (answerText, apiKey) => {
        if (!apiKey) {
          const words = answerText.replace(/[.,\/$%\^&\*;:{}=\-_`~()]/g,"").split(/\s+/);
          const filtered = words.filter(w => w.length > 4);
          return Array.from(new Set(filtered.slice(0, 3)));
        }
        try {
          const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: 'gpt-4o-mini',
              messages: [
                { role: 'system', content: 'Extract 3 to 5 key phrases or core concepts from the given answer text. Return ONLY a JSON array of strings.' },
                { role: 'user', content: answerText }
              ],
              temperature: 0.3
            })
          });
          const data = await response.json();
          const content = data.choices[0].message.content;
          return JSON.parse(content.replace(/```json|```/g, '').trim());
        } catch (e) {
          const words = answerText.split(/\s+/).filter(w => w.length > 4);
          return Array.from(new Set(words.slice(0, 3)));
        }
      },

      gradeAnswer: async (question, originalAnswer, keywords, studentAnswer, apiKey) => {
        if (!apiKey) {
          const covered = keywords.filter(kw => studentAnswer.toLowerCase().includes(kw.toLowerCase()));
          const score = Math.round((covered.length / Math.max(keywords.length, 1)) * 100);
          return {
            score,
            overall: score >= 80 ? 'Mostly correct. Good job capturing the key ideas.' : 'Some key concepts were missing or need better coverage.',
            keywordResults: keywords.map(kw => ({
              keyword: kw,
              status: studentAnswer.toLowerCase().includes(kw.toLowerCase()) ? 'covered' : 'missing',
              explanation: studentAnswer.toLowerCase().includes(kw.toLowerCase()) ? 'Found matching concept or synonym.' : 'Concept not clearly expressed.'
            })),
            missingIdeas: keywords.filter(kw => !studentAnswer.toLowerCase().includes(kw.toLowerCase())),
            grammarCorrections: [],
            incorrectIdeas: [],
            betterVersion: originalAnswer
          };
        }
        try {
          const prompt = `
SOURCE FILE QUESTION:
${question}

SOURCE FILE ANSWER:
${originalAnswer}

USER-CONFIRMED KEYWORDS:
${JSON.stringify(keywords)}

STUDENT ANSWER:
${studentAnswer}

Evaluate the student answer based strictly on the Source File Answer and User-Confirmed Keywords. Return valid JSON matching this schema:
{
  "score": number (0-100),
  "overall": string,
  "keywordResults": [{"keyword": string, "status": "covered"|"partial"|"missing", "explanation": string}],
  "grammarCorrections": [string],
  "missingIdeas": [string],
  "incorrectIdeas": [string],
  "betterVersion": string
}
`;
          const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: 'gpt-4o-mini',
              messages: [
                { role: 'system', content: 'You are a strict semantic evaluator. Return ONLY valid JSON.' },
                { role: 'user', content: prompt }
              ],
              temperature: 0.1
            })
          });
          const data = await response.json();
          const content = data.choices[0]?.message?.content;
          if (!content) throw new Error('No content from OpenAI');
          return JSON.parse(content.replace(/```json|```/g, '').trim());
        } catch (e) {
          const covered = keywords.filter(kw => studentAnswer.toLowerCase().includes(kw.toLowerCase()));
          const score = Math.round((covered.length / Math.max(keywords.length, 1)) * 100);
          return {
            score,
            overall: 'Evaluation completed with fallback mode.',
            keywordResults: keywords.map(kw => ({
              keyword: kw,
              status: studentAnswer.toLowerCase().includes(kw.toLowerCase()) ? 'covered' : 'missing',
              explanation: studentAnswer.toLowerCase().includes(kw.toLowerCase()) ? 'Matched in text.' : 'Missing in text.'
            })),
            missingIdeas: keywords.filter(kw => !studentAnswer.toLowerCase().includes(kw.toLowerCase())),
            grammarCorrections: [],
            incorrectIdeas: [],
            betterVersion: originalAnswer
          };
        }
      }
    };

    function App() {
      const [apiKey, setApiKey] = useState('');
      const [documentData, setDocumentData] = useState(null);
      const [selectedQIndex, setSelectedQIndex] = useState(0);
      const [keywordsMap, setKeywordsMap] = useState({});
      const [viewMode, setViewMode] = useState('editor'); // 'editor', 'study', 'review', 'quiz'
      const [studyLevel, setStudyLevel] = useState(1);
      const [studentAnswer, setStudentAnswer] = useState('');
      const [isGrading, setIsGrading] = useState(false);
      const [gradingResult, setGradingResult] = useState(null);
      const [attempts, setAttempts] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [statusMsg, setStatusMsg] = useState('');

      // Quiz Mode State
      const [quizQuestions, setQuizQuestions] = useState([]);
      const [quizCurrentIdx, setQuizCurrentIdx] = useState(0);
      const [quizAnswers, setQuizAnswers] = useState({});
      const [quizResults, setQuizResults] = useState(null);
      const [isQuizGrading, setIsQuizGrading] = useState(false);

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsLoading(true);
        setStatusMsg(`Parsing ${file.name}...`);

        try {
          const text = await readFileContent(file);
          const parsedQuestions = parseTextIntoQA(text, file.name);
          
          setDocumentData({
            id: 'doc-' + Date.now(),
            filename: file.name,
            questions: parsedQuestions
          });

          const initialMap = {};
          parsedQuestions.forEach(q => {
            initialMap[q.id] = [];
          });
          setKeywordsMap(initialMap);
          setSelectedQIndex(0);
          setViewMode('editor');
          setStudentAnswer('');
          setGradingResult(null);
        } catch (err) {
          alert('Error parsing file: ' + err.message);
        } finally {
          setIsLoading(false);
          setStatusMsg('');
        }
      };

      const readFileContent = async (file) => {
        const ext = file.name.split('.').pop().toLowerCase();
        if (ext === 'txt') {
          return await file.text();
        } else if (ext === 'docx') {
          const arrayBuffer = await file.arrayBuffer();
          const result = await window.mammoth.extractRawText({ arrayBuffer });
          return result.value;
        } else if (ext === 'pdf') {
          const arrayBuffer = await file.arrayBuffer();
          const loadingTask = window.pdfjsLib.getDocument({ data: arrayBuffer });
          const pdf = await loadingTask.promise;
          let fullText = '';
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            fullText += textContent.items.map(item => item.str).join(' ') + '\n';
          }
          return fullText;
        } else {
          throw new Error('Unsupported file format');
        }
      };

      const parseTextIntoQA = (text, filename) => {
        const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
        const questions = [];
        let currentQ = null;
        let currentA = null;

        lines.forEach((line) => {
          if (line.toLowerCase().startsWith('q') || line.endsWith('?')) {
            if (currentQ && currentA) {
              questions.push({
                id: 'q_' + (questions.length + 1),
                order: questions.length + 1,
                question: currentQ,
                originalAnswer: currentA
              });
              currentA = null;
            }
            currentQ = line.replace(/^[Qq]\d*[\.\:]?\s*/, '');
          } else if (line.toLowerCase().startsWith('a') || currentQ) {
            const cleanLine = line.replace(/^[Aa]\d*[\.\:]?\s*/, '');
            if (!currentA) currentA = cleanLine;
            else currentA += ' ' + cleanLine;
          }
        });

        if (currentQ && currentA) {
          questions.push({
            id: 'q_' + (questions.length + 1),
            order: questions.length + 1,
            question: currentQ,
            originalAnswer: currentA
          });
        }

        if (questions.length === 0) {
          questions.push({
            id: 'q_1',
            order: 1,
            question: `Summarize key concepts from ${filename}`,
            originalAnswer: text.slice(0, 600)
          });
        }

        return questions;
      };

      const currentQuestion = documentData && documentData.questions[selectedQIndex];

      const handleGenerateKeywords = async () => {
        if (!currentQuestion) return;
        setIsLoading(true);
        setStatusMsg('AI is extracting key memory anchors from source answer...');
        try {
          const suggested = await AIService.extractKeywords(currentQuestion.originalAnswer, apiKey);
          setKeywordsMap(prev => ({
            ...prev,
            [currentQuestion.id]: Array.from(new Set([...(prev[currentQuestion.id] || []), ...suggested]))
          }));
        } catch (err) {
          alert('Failed to generate keywords');
        } finally {
          setIsLoading(false);
          setStatusMsg('');
        }
      };

      // Instant highlight on mouseup
      const handleMouseUpOnAnswer = () => {
        const selection = window.getSelection();
        const selectedText = selection ? selection.toString().trim() : '';
        if (!selectedText || !currentQuestion) return;

        if (currentQuestion.originalAnswer.includes(selectedText)) {
          const currentList = keywordsMap[currentQuestion.id] || [];
          if (!currentList.includes(selectedText)) {
            setKeywordsMap(prev => ({
              ...prev,
              [currentQuestion.id]: [...currentList, selectedText]
            }));
          }
          if (window.getSelection) {
            window.getSelection().removeAllRanges();
          }
        }
      };

      const handleRemoveKeyword = (qId, kwToRemove) => {
        setKeywordsMap(prev => ({
          ...prev,
          [qId]: (prev[qId] || []).filter(kw => kw !== kwToRemove)
        }));
      };

      const handleAddManualKeyword = (qId) => {
        const newKw = prompt('Enter new keyword or phrase:');
        if (newKw && newKw.trim()) {
          setKeywordsMap(prev => ({
            ...prev,
            [qId]: [...(prev[qId] || []), newKw.trim()]
          }));
        }
      };

      const handleCheckAnswer = async () => {
        if (!studentAnswer.trim()) {
          alert('Please enter your answer first.');
          return;
        }
        setIsGrading(true);
        const activeKeywords = keywordsMap[currentQuestion.id] || [];
        const result = await AIService.gradeAnswer(
          currentQuestion.question,
          currentQuestion.originalAnswer,
          activeKeywords,
          studentAnswer,
          apiKey
        );
        setGradingResult(result);
        setIsGrading(false);

        const newAttempt = {
          id: 'att_' + Date.now(),
          questionId: currentQuestion.id,
          studentAnswer,
          score: result.score,
          keywordResults: result.keywordResults,
          missingIdeas: result.missingIdeas,
          timestamp: new Date().toLocaleTimeString()
        };
        setAttempts(prev => [newAttempt, ...prev]);
      };

      const reviewQuestions = documentData ? documentData.questions.filter(q => {
        const atts = attempts.filter(a => a.questionId === q.id);
        if (atts.length === 0) return false;
        return atts[0].score < 80;
      }) : [];

      // Start Quiz Test (5 random questions)
      const handleStartQuiz = () => {
        if (!documentData || documentData.questions.length === 0) return;
        const shuffled = [...documentData.questions].sort(() => 0.5 - Math.random());
        const selected5 = shuffled.slice(0, 5);
        setQuizQuestions(selected5);
        setQuizCurrentIdx(0);
        setQuizAnswers({});
        setQuizResults(null);
        setViewMode('quiz');
      };

      const handleFinishQuiz = async () => {
        setIsQuizGrading(true);
        const results = [];
        for (let q of quizQuestions) {
          const ans = quizAnswers[q.id] || '';
          const activeKws = keywordsMap[q.id] || [];
          const res = await AIService.gradeAnswer(q.question, q.originalAnswer, activeKws, ans, apiKey);
          results.push({
            question: q,
            studentAnswer: ans,
            grading: res
          });
        }
        setQuizResults(results);
        setIsQuizGrading(false);
      };

      const renderHighlightedAnswer = (q) => {
        const text = q.originalAnswer;
        const keywords = keywordsMap[q.id] || [];
        if (keywords.length === 0) return text;

        const escapedKws = keywords
          .filter(Boolean)
          .sort((a, b) => b.length - a.length)
          .map(kw => kw.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'));

        if (escapedKws.length === 0) return text;

        const regex = new RegExp(`(${escapedKws.join('|')})`, 'gi');
        const parts = text.split(regex);

        return parts.map((part, i) => {
          const isKeyword = keywords.some(kw => kw.toLowerCase() === part.toLowerCase());
          if (isKeyword) {
            return (
              <span key={i} className="highlight-keyword" title="Memory Anchor">
                {part}
              </span>
            );
          }
          return part;
        });
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          <header className="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shadow-sm flex-shrink-0">
            <div className="flex items-center space-x-3">
              <div className="bg-indigo-600 text-white p-2 rounded-xl font-bold shadow">
                <i className="fa-solid fa-anchor"></i>
              </div>
              <div>
                <h1 className="text-base font-bold text-slate-900">MemoryAnchor</h1>
                <p className="text-xs text-slate-500">Source-of-Truth AI Q&A Learning Platform</p>
              </div>
            </div>

            <div className="flex items-center space-x-4">
              {documentData && (
                <button
                  onClick={handleStartQuiz}
                  className="bg-purple-600 hover:bg-purple-700 text-white text-xs px-3.5 py-2 rounded-lg font-bold shadow flex items-center gap-1.5 transition"
                >
                  <i className="fa-solid fa-graduation-cap"></i> Take 5-Question Quiz
                </button>
              )}
              <div className="flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 text-xs">
                <i className="fa-solid fa-key text-slate-400"></i>
                <input
                  type="password"
                  placeholder="OpenAI API Key (Optional)"
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  className="bg-transparent focus:outline-none w-44 text-slate-700"
                />
              </div>
            </div>
          </header>

          {documentData ? (
            <div className="flex-1 flex overflow-hidden">
              {/* Sidebar with compact scrollable questions */}
              <aside className="w-80 bg-white border-r border-slate-200 flex flex-col h-[calc(100vh-57px)] flex-shrink-0">
                <div className="p-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center flex-shrink-0">
                  <div className="overflow-hidden pr-2">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Document</span>
                    <h3 className="text-xs font-bold text-slate-800 truncate" title={documentData.filename}>{documentData.filename}</h3>
                  </div>
                  <label className="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-2.5 py-1.5 rounded-lg font-semibold cursor-pointer transition flex-shrink-0">
                    Change <input type="file" accept=".pdf,.docx,.txt" onChange={handleFileUpload} className="hidden" />
                  </label>
                </div>

                <div className="p-3 border-b border-slate-100 flex space-x-1 flex-shrink-0 bg-white">
                  <button
                    onClick={() => { setViewMode('editor'); setStudentAnswer(''); setGradingResult(null); }}
                    className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${viewMode === 'editor' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    Keywords
                  </button>
                  <button
                    onClick={() => { setViewMode('study'); setStudentAnswer(''); setGradingResult(null); }}
                    className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${viewMode === 'study' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    Study
                  </button>
                  <button
                    onClick={() => { setViewMode('review'); setStudentAnswer(''); setGradingResult(null); }}
                    className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${viewMode === 'review' ? 'bg-red-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    Review ({reviewQuestions.length})
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-2 space-y-1">
                  {documentData.questions.map((q, idx) => (
                    <button
                      key={q.id}
                      onClick={() => {
                        setSelectedQIndex(idx);
                        setStudentAnswer('');
                        setGradingResult(null);
                        if (viewMode === 'quiz') setViewMode('study');
                      }}
                      className={`w-full text-left p-2 rounded-xl text-xs font-medium transition flex items-center space-x-2 ${selectedQIndex === idx && viewMode !== 'quiz' ? 'bg-indigo-50 text-indigo-900 border border-indigo-200 font-bold' : 'text-slate-600 hover:bg-slate-50'}`}
                    >
                      <span className="font-bold text-slate-400 flex-shrink-0">Q{q.order}</span>
                      <span className="truncate flex-1">{q.question}</span>
                    </button>
                  ))}
                </div>
              </aside>

              {/* Main Content Area */}
              <main className="flex-1 overflow-y-auto p-6 bg-slate-50/50">
                {viewMode === 'quiz' ? (
                  <div className="max-w-3xl mx-auto space-y-6">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                      <div>
                        <span className="text-xs font-bold text-purple-600 uppercase tracking-wider">Random Practice Quiz</span>
                        <h2 className="text-lg font-bold text-slate-900">Question {quizCurrentIdx + 1} of {quizQuestions.length}</h2>
                      </div>
                      <button
                        onClick={() => setViewMode('study')}
                        className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-semibold"
                      >
                        Exit Quiz
                      </button>
                    </div>

                    {quizResults ? (
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                        <div className="border-b border-slate-200 pb-4 flex justify-between items-center">
                          <div>
                            <h3 className="text-lg font-bold text-slate-800">Quiz Results Summary</h3>
                            <p className="text-xs text-slate-500">Evaluated across your 5 random questions</p>
                          </div>
                          <div className="text-2xl font-black bg-indigo-100 text-indigo-800 px-4 py-2 rounded-xl">
                            {Math.round(quizResults.reduce((acc, r) => acc + r.grading.score, 0) / quizResults.length)}% Avg
                          </div>
                        </div>

                        <div className="space-y-4">
                          {quizResults.map((res, i) => (
                            <div key={i} className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                              <div className="flex justify-between items-start">
                                <span className="text-xs font-bold text-slate-500">Q{res.question.order}: {res.question.question}</span>
                                <span className={`text-xs font-bold px-2.5 py-1 rounded-lg ${res.grading.score >= 80 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                  {res.grading.score}%
                                </span>
                              </div>
                              <p className="text-xs text-slate-700 font-medium">Your answer: {res.studentAnswer || '(No answer provided)'}</p>
                              <p className="text-xs text-slate-500">{res.grading.overall}</p>
                            </div>
                          ))}
                        </div>

                        <div className="flex justify-end">
                          <button
                            onClick={handleStartQuiz}
                            className="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow"
                          >
                            Retake Another 5 Questions
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                        <div className="space-y-2">
                          <span className="text-xs font-bold text-slate-400 uppercase">Question</span>
                          <h3 className="text-base font-bold text-slate-800 leading-snug">{quizQuestions[quizCurrentIdx]?.question}</h3>
                        </div>

                        <div className="space-y-2">
                          <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">Your Answer</label>
                          <textarea
                            rows="5"
                            placeholder="Type your answer based on document..."
                            value={quizAnswers[quizQuestions[quizCurrentIdx]?.id] || ''}
                            onChange={(e) => {
                              const val = e.target.value;
                              setQuizAnswers(prev => ({ ...prev, [quizQuestions[quizCurrentIdx].id]: val }));
                            }}
                            className="w-full p-4 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-purple-500 text-slate-800 text-sm shadow-inner"
                          ></textarea>
                        </div>

                        <div className="flex justify-between items-center pt-2">
                          <button
                            disabled={quizCurrentIdx === 0}
                            onClick={() => setQuizCurrentIdx(prev => Math.max(0, prev - 1))}
                            className="px-4 py-2 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold disabled:opacity-40"
                          >
                            Previous
                          </button>

                          {quizCurrentIdx < quizQuestions.length - 1 ? (
                            <button
                              onClick={() => setQuizCurrentIdx(prev => Math.min(quizQuestions.length - 1, prev + 1))}
                              className="px-5 py-2 rounded-lg bg-purple-600 text-white text-xs font-bold shadow"
                            >
                              Next Question
                            </button>
                          ) : (
                            <button
                              disabled={isQuizGrading}
                              onClick={handleFinishQuiz}
                              className="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow"
                            >
                              {isQuizGrading ? 'Grading Quiz...' : 'Submit & Grade Quiz'}
                            </button>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                ) : currentQuestion ? (
                  <div className="max-w-3xl mx-auto space-y-6">
                    {/* Sticky Question Header */}
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1.5 sticky top-0 z-20 backdrop-blur-md bg-white/95">
                      <span className="text-[11px] font-bold text-indigo-600 uppercase tracking-wider">Question #{currentQuestion.order}</span>
                      <h2 className="text-lg font-bold text-slate-900 leading-snug">{currentQuestion.question}</h2>
                    </div>

                    {viewMode === 'editor' && (
                      <div className="space-y-6 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div className="space-y-2">
                          <div className="flex justify-between items-center">
                            <label className="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1">
                              <i className="fa-solid fa-highlighter text-amber-500"></i> Original Source Answer (Highlight text to instantly add as keyword)
                            </label>
                          </div>
                          
                          <div 
                            onMouseUp={handleMouseUpOnAnswer}
                            className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-slate-800 leading-relaxed font-normal text-sm shadow-inner min-h-[100px] select-text cursor-text"
                          >
                            {renderHighlightedAnswer(currentQuestion)}
                          </div>
                        </div>

                        <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 space-y-4">
                          <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                            <div>
                              <h3 className="text-sm font-bold text-slate-800">Memory Anchors (Keywords)</h3>
                              <p className="text-xs text-slate-500">Selected instantly by highlighting text above or using AI generation.</p>
                            </div>
                            <button
                              onClick={handleGenerateKeywords}
                              disabled={isLoading}
                              className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium shadow transition flex items-center gap-1.5 disabled:opacity-50"
                            >
                              <i className="fa-solid fa-wand-magic-sparkles"></i>
                              {isLoading ? 'Extracting...' : 'Generate Keywords'}
                            </button>
                          </div>

                          <div className="flex flex-wrap gap-2">
                            {(keywordsMap[currentQuestion.id] || []).length === 0 ? (
                              <p className="text-xs text-slate-400 italic">No keywords created yet. Highlight text above or click "Generate Keywords".</p>
                            ) : (
                              (keywordsMap[currentQuestion.id] || []).map((kw, i) => (
                                <span key={i} className="bg-yellow-100 text-yellow-900 border border-yellow-300 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-2 shadow-sm">
                                  <span>💡 {kw}</span>
                                  <button 
                                    onClick={() => handleRemoveKeyword(currentQuestion.id, kw)}
                                    className="text-yellow-700 hover:text-red-600 font-bold"
                                  >
                                    &times;
                                  </button>
                                </span>
                              ))
                            )}
                            <button 
                              onClick={() => handleAddManualKeyword(currentQuestion.id)}
                              className="border border-dashed border-slate-300 text-slate-600 hover:bg-slate-100 px-3 py-1 rounded-full text-xs font-medium"
                            >
                              + Add Phrase
                            </button>
                          </div>

                          <div className="pt-2 flex justify-end">
                            <button
                              onClick={() => {
                                setViewMode('study');
                                setStudentAnswer('');
                                setGradingResult(null);
                              }}
                              className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg font-semibold text-sm shadow flex items-center gap-2"
                            >
                              <i className="fa-solid fa-check"></i> Confirm Keywords & Go to Study
                            </button>
                          </div>
                        </div>
                      </div>
                    )}

                    {viewMode === 'study' && (
                      <div className="space-y-6 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div className="flex justify-between items-center bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                          <span className="text-xs font-bold text-slate-500 uppercase px-3">Study Level:</span>
                          <div className="flex space-x-1">
                            {[1, 2, 3].map((lvl) => (
                              <button
                                key={lvl}
                                onClick={() => {
                                  if (lvl === studyLevel) return;
                                  const levelNames = { 1: 'Full Keywords', 2: 'Partial Keywords', 3: 'Pure Recall' };
                                  const confirmMsg = `Bạn đã sẵn sàng sang Level ${lvl} (${levelNames[lvl]}) chưa? Câu trả lời hiện tại sẽ được làm mới.`;
                                  if (window.confirm(confirmMsg)) {
                                    setStudyLevel(lvl);
                                    setStudentAnswer('');
                                    setGradingResult(null);
                                  }
                                }}
                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${studyLevel === lvl ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-200'}`}
                              >
                                Level {lvl}: {lvl === 1 ? 'Full' : lvl === 2 ? 'Partial' : 'Recall'}
                              </button>
                            ))}
                          </div>
                        </div>

                        {studyLevel < 3 && (
                          <div className="bg-amber-50/60 border border-amber-200 p-4 rounded-xl space-y-2">
                            <span className="text-xs font-bold text-amber-800 uppercase tracking-wider flex items-center gap-1">
                              <i className="fa-solid fa-lightbulb text-amber-600"></i> Memory Anchors / Hints
                            </span>
                            <div className="flex flex-wrap gap-2">
                              {(keywordsMap[currentQuestion.id] || []).length === 0 ? (
                                <p className="text-xs text-amber-700 italic">No keywords set. Go back to Keywords tab to select.</p>
                              ) : (
                                (keywordsMap[currentQuestion.id] || []).map((kw, i) => (
                                  <span key={i} className="bg-amber-100 text-amber-900 border border-amber-300 px-3 py-1 rounded-full text-xs font-semibold">
                                    🟨 {studyLevel === 1 ? kw : kw.split(' ').map(w => w[0] + '...').join(' ')}
                                  </span>
                                ))
                              )}
                            </div>
                          </div>
                        )}

                        <div className="space-y-2">
                          <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">Your Answer (In your own words)</label>
                          <textarea
                            rows="5"
                            placeholder="Type what you recall from the document. AI will evaluate meaning coverage against the source file..."
                            value={studentAnswer}
                            onChange={(e) => setStudentAnswer(e.target.value)}
                            className="w-full p-4 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 leading-relaxed font-normal shadow-sm text-sm"
                          ></textarea>
                        </div>

                        <div className="flex justify-between items-center">
                          <p className="text-xs text-slate-400">
                            * Evaluated semantically against original document text. Synonyms & paraphrases are accepted.
                          </p>
                          <button
                            onClick={handleCheckAnswer}
                            disabled={isGrading}
                            className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow transition flex items-center gap-2 disabled:opacity-50"
                          >
                            <i className="fa-solid fa-paper-plane"></i>
                            {isGrading ? 'AI Grading...' : 'Check Answer'}
                          </button>
                        </div>

                        {gradingResult && (
                          <div className="bg-slate-50 border border-slate-200 rounded-xl p-6 space-y-5 mt-6 shadow-sm">
                            <div className="flex justify-between items-center border-b border-slate-200 pb-4">
                              <div>
                                <span className="text-xs font-bold text-slate-400 uppercase">Evaluation Result</span>
                                <h3 className="text-lg font-bold text-slate-800">{gradingResult.overall}</h3>
                              </div>
                              <div className={`text-2xl font-black px-4 py-2 rounded-xl ${gradingResult.score >= 80 ? 'bg-emerald-100 text-emerald-800' : gradingResult.score >= 50 ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800'}`}>
                                {gradingResult.score}%
                              </div>
                            </div>

                            <div className="space-y-3">
                              <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider">Keyword Coverage Details</h4>
                              <div className="space-y-2">
                                {gradingResult.keywordResults.map((item, index) => (
                                  <div key={index} className="p-3 bg-white rounded-lg border border-slate-200 flex items-start space-x-3 text-xs">
                                    {item.status === 'covered' && <span className="text-emerald-600 text-base">🟢</span>}
                                    {item.status === 'partial' && <span className="text-amber-500 text-base">🟡</span>}
                                    {item.status === 'missing' && <span className="text-red-500 text-base">🔴</span>}
                                    <div className="flex-1">
                                      <div className="font-bold text-slate-800">{item.keyword}</div>
                                      <div className="text-slate-600 mt-0.5">{item.explanation}</div>
                                    </div>
                                    <span className="font-bold uppercase text-[10px] px-2 py-0.5 rounded bg-slate-100 text-slate-600">
                                      {item.status}
                                    </span>
                                  </div>
                                ))}
                              </div>
                            </div>

                            <div className="p-4 bg-indigo-50/60 rounded-lg border border-indigo-100 space-y-1">
                              <span className="text-[11px] font-bold text-indigo-700 uppercase">Exact Source Answer Reference</span>
                              <p className="text-xs text-indigo-950 italic">{currentQuestion.originalAnswer}</p>
                            </div>
                          </div>
                        )}
                      </div>
                    )}

                    {viewMode === 'review' && (
                      <div className="space-y-6 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div className="bg-red-50 p-5 rounded-xl border border-red-100">
                          <h2 className="text-lg font-bold text-red-900 flex items-center gap-2">
                            <i className="fa-solid fa-triangle-exclamation"></i> Review Mistakes & Missing Key Concepts
                          </h2>
                          <p className="text-xs text-red-700 mt-1">
                            Questions where concepts were missed during recent recall attempts.
                          </p>
                        </div>

                        {reviewQuestions.length === 0 ? (
                          <div className="text-center py-12 text-slate-400">
                            <i className="fa-solid fa-circle-check text-4xl text-emerald-400 mb-2"></i>
                            <p className="font-medium text-sm">No weak questions identified yet!</p>
                          </div>
                        ) : (
                          <div className="space-y-4">
                            {reviewQuestions.map((rq) => {
                              const lastAttempt = attempts.find(a => a.questionId === rq.id);
                              return (
                                <div key={rq.id} className="p-4 bg-white rounded-xl border border-slate-200 shadow-sm space-y-3">
                                  <div className="flex justify-between items-start">
                                    <span className="text-xs font-bold text-slate-500">Q{rq.order}</span>
                                    <span className="text-xs font-bold bg-red-100 text-red-700 px-2 py-0.5 rounded">
                                      Score: {lastAttempt ? lastAttempt.score : 0}%
                                    </span>
                                  </div>
                                  <h4 className="text-sm font-bold text-slate-800">{rq.question}</h4>
                                  
                                  {lastAttempt && lastAttempt.missingIdeas && (
                                    <div className="bg-slate-50 p-3 rounded-lg text-xs space-y-1">
                                      <span className="font-bold text-red-600">Missing Concepts:</span>
                                      <ul className="list-disc list-inside text-slate-600">
                                        {lastAttempt.missingIdeas.map((idea, i) => (
                                          <li key={i}>{idea}</li>
                                        ))}
                                      </ul>
                                    </div>
                                  )}

                                  <div className="flex justify-end">
                                    <button 
                                      onClick={() => {
                                        const qIdx = documentData.questions.findIndex(q => q.id === rq.id);
                                        setSelectedQIndex(qIdx);
                                        setViewMode('study');
                                        setStudentAnswer('');
                                        setGradingResult(null);
                                      }}
                                      className="text-xs bg-indigo-600 text-white font-semibold px-3 py-1.5 rounded-lg hover:bg-indigo-700 transition"
                                    >
                                      Re-study This Question
                                    </button>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="text-center py-20 text-slate-400 text-sm">
                    Select a question from the sidebar to view.
                  </div>
                )}
              </main>
            </div>
          ) : (
            <div className="max-w-2xl mx-auto my-auto p-8 bg-white shadow-xl rounded-2xl border border-slate-200 text-center space-y-6">
              <div className="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                <i className="fa-solid fa-cloud-arrow-up"></i>
              </div>
              <div className="space-y-2">
                <h2 className="text-2xl font-bold text-slate-800">Upload Source Document</h2>
                <p className="text-sm text-slate-500 max-w-md mx-auto">
                  Upload your PDF, DOCX, or TXT file. The contents will serve as the strict Source of Truth for Q&A extraction and AI grading.
                </p>
              </div>

              {isLoading ? (
                <div className="py-8 space-y-3">
                  <div className="inline-block animate-spin text-3xl text-indigo-600">
                    <i className="fa-solid fa-circle-notch"></i>
                  </div>
                  <p className="text-sm font-semibold text-slate-600">{statusMsg}</p>
                </div>
              ) : (
                <div className="flex justify-center">
                  <label className="inline-block cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-8 py-3.5 rounded-xl shadow-md transition transform active:scale-95 text-sm">
                    <span>Choose File (PDF, DOCX, TXT)</span>
                    <input type="file" accept=".pdf,.docx,.txt" onChange={handleFileUpload} className="hidden" />
                  </label>
                </div>
              )}

              <div className="pt-4 border-t border-slate-100 grid grid-cols-3 gap-4 text-xs text-slate-500">
                <div className="p-2">
                  <i className="fa-solid fa-shield-halved text-indigo-500 text-base mb-1 block"></i>
                  <span>100% Document Truth</span>
                </div>
                <div className="p-2">
                  <i className="fa-solid fa-highlighter text-amber-500 text-base mb-1 block"></i>
                  <span>Instant Highlight Keywords</span>
                </div>
                <div className="p-2">
                  <i className="fa-solid fa-graduation-cap text-purple-500 text-base mb-1 block"></i>
                  <span>5-Question Random Quiz</span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
